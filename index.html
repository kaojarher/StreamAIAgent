<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小蝦 v8 · 多角色工作流</title>
<style>
:root{--bg:#f3f5f4;--panel:#fff;--ink:#17211f;--mute:#5d6b67;--line:#d6dddb;--accent:#0f6b5c;--accent-ink:#fff;--tool:#eef3f1;--warn:#a8431f;--soft:#e3efe9}
@media (prefers-color-scheme:dark){:root{--bg:#121816;--panel:#1a2320;--ink:#e6eeeb;--mute:#93a39e;--line:#2b3733;--accent:#4fc3a8;--accent-ink:#06211b;--tool:#202b28;--warn:#e88b65;--soft:#22342e}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}body{height:100dvh}
body{font:14px/1.55 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;background:var(--bg);color:var(--ink);display:grid;grid-template-columns:clamp(320px,30vw,420px) 1fr;grid-template-rows:minmax(0,1fr);overflow:hidden}#log{min-height:0}
aside{background:var(--panel);border-right:1px solid var(--line);padding:14px;overflow:auto}
main{display:flex;flex-direction:column;min-width:0;height:100%}
h1{font-size:18px;margin:0 0 10px}
section>summary{font-weight:600;cursor:pointer;padding:6px 0}
section{border-top:1px solid var(--line);padding:4px 0}
label{display:block;font-size:12px;color:var(--mute);margin:8px 0 2px}
input,select,textarea,button{font:inherit;color:inherit}
input[type=text],input[type=password],input[type=number],select,textarea{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
textarea{resize:vertical}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);padding:6px 10px;border-radius:6px}
button.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.row>select,.row>input{flex:1;width:auto}
.chk{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--ink);margin:6px 12px 0 0}
.card{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:8px 0;background:var(--bg)}
.card>summary{cursor:pointer;font-weight:600}
.step{border-left:3px solid var(--accent)}
.folder{font-size:13px;margin-top:6px;word-break:break-all}.bad{color:var(--warn)}
.bar{display:flex;gap:8px;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--panel);align-items:flex-start}
.bar textarea{flex:1;height:58px}
#log{flex:1;overflow:auto;padding:16px max(16px,calc((100% - 820px)/2))}
.m{margin:0 0 12px;padding:9px 13px;border-radius:10px;white-space:pre-wrap;word-break:break-word;background:var(--panel);border:1px solid var(--line)}
.m .who{display:block;font-size:12px;color:var(--accent);margin-bottom:2px}.m.md{white-space:normal}.md h3,.md h4,.md h5,.md h6{margin:.6em 0 .2em;font-size:1em}.md pre{background:var(--tool);padding:8px;border-radius:6px;overflow:auto;white-space:pre-wrap}.md code{background:var(--tool);padding:0 4px;border-radius:4px}.md .li{padding-left:.5em}.cp{font-size:12px;padding:3px 10px;min-height:0}.dls{margin-top:8px}
.m.md .body{max-height:65vh;overflow:auto;padding-right:4px}
.md p,.md ul,.md ol{margin:.4em 0}.md ul,.md ol{padding-left:1.4em}
.md table{border-collapse:collapse;display:block;overflow-x:auto;margin:.5em 0}.md th,.md td{border:1px solid var(--line);padding:4px 8px;white-space:nowrap}.md th{background:var(--tool)}
.md blockquote{margin:.5em 0;padding-left:10px;border-left:3px solid var(--accent);color:var(--mute)}.md hr{border:0;border-top:1px solid var(--line);margin:.8em 0}
#prog{padding:8px 18px;border-bottom:1px solid var(--line);background:var(--panel)}
.pbar{height:8px;background:var(--tool);border-radius:4px;overflow:hidden}.pbar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
#stat{font-size:13px;color:var(--mute);margin-top:4px}
#chips{display:flex;gap:6px;overflow-x:auto;padding-top:6px}
.srow{display:flex;justify-content:space-between;align-items:center;gap:8px}
#prog.col #chips{display:none}#ex{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:6px 18px;font-size:12px;color:var(--mute);background:var(--panel);border-bottom:1px solid var(--line)}
#chips{display:flex;align-items:stretch;gap:4px;overflow-x:auto;padding:14px 6px 10px}
.grp{display:flex;flex-direction:column;gap:14px;justify-content:center}
.arr{align-self:center;color:var(--mute);font-size:20px;padding:0 2px}
.note{--bgc:#fff3a3;position:relative;flex:none;width:170px;min-height:112px;padding:16px 12px 12px;background:var(--bgc);color:#2b2b1f;border-radius:2px 2px 16px 2px;box-shadow:0 3px 8px rgba(0,0,0,.25);font-size:13px;line-height:1.4;transform:rotate(var(--rot,-1.2deg));cursor:pointer;transition:transform .2s,opacity .2s}
.note:hover{transform:rotate(0) translateY(-2px)}
.note::before{content:"";position:absolute;top:-7px;left:50%;width:46px;height:14px;margin-left:-23px;background:rgba(255,255,255,.6);box-shadow:0 1px 2px rgba(0,0,0,.18)}
.note b{display:block;font-size:14px}
.note .tk{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin:4px 0 6px}
.note small{display:block;color:#5a5a45;font-size:11px}
.note .stamp{position:absolute;right:8px;bottom:8px;font-size:12px;font-weight:700;border:2px solid currentColor;border-radius:6px;padding:0 6px;transform:rotate(-8deg);background:rgba(255,255,255,.35)}
.note.c0{--bgc:#fff3a3}.note.c1{--bgc:#ffc9d9}.note.c2{--bgc:#bfe3ff}.note.c3{--bgc:#c8f0c0}.note.c4{--bgc:#ffd9a8}.note.c5{--bgc:#e0cdfb}
.note.wait{opacity:.85}.note.skip{opacity:.45}
.note.run{outline:3px solid var(--accent);animation:pulse 1.4s ease-in-out infinite}
.note.run .stamp{color:#0f6b5c}.note.ok .stamp{color:#1b6b3a}
.note.bad{outline:3px dashed #c4501f}.note.bad .stamp,.note.err .stamp{color:#c4501f}
@keyframes pulse{50%{transform:rotate(0) scale(1.04)}}
@media (prefers-reduced-motion:reduce){.note.run{animation:none}}
.chip{white-space:nowrap;font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;background:var(--bg)}
.chip.run{border-color:var(--accent);color:var(--accent);font-weight:600}.chip.ok{background:var(--soft)}.chip.bad,.chip.err{border-color:var(--warn);color:var(--warn)}.chip.skip{opacity:.5}#tabs{display:none}
.m.h{background:var(--soft);border-color:var(--accent)}
.m.e{border-color:var(--warn);color:var(--warn)}
.m.s{background:none;border:0;color:var(--mute);padding:2px 4px;font-size:13px}
details.t{margin:0 0 10px;background:var(--tool);border-radius:8px;padding:5px 12px;font-size:12px}
details.t summary{cursor:pointer;color:var(--mute)}
details.t pre{margin:6px 0;white-space:pre-wrap;word-break:break-all;max-height:200px;overflow:auto}
.gate textarea{height:140px;margin:6px 0}
@media (max-width:900px){
body{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
#tabs{display:flex;background:var(--panel);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
#tabs button{flex:1;border:0;border-radius:0;padding:12px;font-weight:600;background:none}
#tabs button.on{color:var(--accent);box-shadow:inset 0 -3px var(--accent)}
aside,main{grid-row:2;grid-column:1;min-height:0}
body[data-v="run"] aside{display:none}body[data-v="set"] main{display:none}
aside{border:0;padding:12px 14px calc(18px + env(safe-area-inset-bottom))}
input,select,textarea{font-size:16px}button{min-height:40px}
.bar{flex-direction:column;padding:10px 12px}.bar textarea{width:100%;flex:none}
.bar .acts{flex-direction:row!important;flex-wrap:wrap;align-items:stretch!important;width:100%}
.bar .acts>*{flex:1 1 140px}
#log{padding:12px}.bar textarea{height:48px}.m.md .body{max-height:55dvh}#prog{padding:8px 12px}
}
.helpbtn{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:50;width:38px;height:38px;min-height:0;padding:0;border-radius:50%;background:var(--accent);color:var(--accent-ink);border:0;font-weight:700;font-size:18px;line-height:1;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.help{position:fixed;inset:0;z-index:100}
.help[hidden]{display:none}
.help.dim{background:rgba(0,0,0,.55)}
.spot{position:fixed;z-index:1;border-radius:10px;pointer-events:none;box-shadow:0 0 0 3px var(--accent),0 0 0 100vmax rgba(0,0,0,.55);transition:left .25s,top .25s,width .25s,height .25s;animation:spotp 1.6s ease-in-out infinite}
.spot[hidden]{display:none}
@keyframes spotp{50%{box-shadow:0 0 0 7px var(--accent),0 0 0 100vmax rgba(0,0,0,.55)}}
@media (prefers-reduced-motion:reduce){.spot{animation:none;transition:none}}
.hbox{position:absolute;z-index:2;left:0;top:0;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:12px;width:min(440px,calc(100vw - 24px));display:flex;flex-direction:column;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.harr{position:absolute;width:12px;height:12px;background:var(--panel);border:0 solid var(--line);transform:rotate(45deg)}
.harr[hidden]{display:none}
.harr.al{left:-7px;border-left-width:1px;border-bottom-width:1px}
.harr.au{top:-7px;border-top-width:1px;border-left-width:1px}
.harr.ad{bottom:-7px;border-right-width:1px;border-bottom-width:1px}
.harr.ar{right:-7px;border-top-width:1px;border-right-width:1px}
.hhead{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:14px 18px 8px}
.hhead h2{margin:0;font-size:17px}
.hbody{padding:4px 18px 8px;overflow:auto;flex:1;min-height:0}
.hbody p,.hbody ul{margin:.5em 0}.hbody ul{padding-left:1.3em}.hbody li{margin:.3em 0}
.hbody kbd{font:inherit;font-size:12px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--tool)}
.hbody code{background:var(--tool);padding:0 4px;border-radius:4px}
.hbody .tip{background:var(--soft);border-left:3px solid var(--accent);border-radius:4px;padding:6px 10px;font-size:13px}
.hbody .where{display:inline-block;font-size:12px;font-weight:700;color:var(--accent-ink);background:var(--accent);border-radius:999px;padding:0 10px;margin:0 0 4px}
.hfoot{display:flex;align-items:center;gap:8px;padding:10px 18px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.hdots{display:flex;gap:2px;flex:1;justify-content:center;align-items:center;flex-wrap:wrap}
.dot{width:14px;height:14px;min-height:0;padding:0;border-radius:50%;border:0;background:none;position:relative}
.dot::before{content:"";position:absolute;inset:2px;border-radius:50%;border:1px solid var(--accent)}
.dot.on::before{background:var(--accent)}
.hcount{font-size:12px;color:var(--mute)}
</style>
</head>
<body data-v="set">
<div id="tabs"><button data-v="set" class="on">設定</button><button data-v="run">執行</button></div>
<aside id="side"></aside>
<main>
  <div class="bar">
    <textarea id="goal" placeholder="用口語描述想做的事就好，例如：幫我比對 舊版.xlsx 和 新版.xlsx 的差異並整理成表格"></textarea>
    <div class="row acts" style="flex-direction:column;align-items:stretch">
      <button class="pri" id="auto">智慧執行</button><button id="run">執行選定的流程</button><button id="stop" hidden>停止</button>
      <select id="from" title="起始步驟"></select>
      <button id="dl">下載紀錄</button>
      <select id="hist" title="歷史紀錄"></select>
    </div>
  </div>
  <div id="ex"></div>
  <div id="prog" hidden><div class="pbar"><i id="pfill"></i></div><div class="srow"><div id="stat"></div><button class="cp" id="ptog">收合便利貼</button></div><div id="chips"></div></div>
  <div id="log"></div>
</main>

<button id="helpBtn" class="helpbtn" type="button" aria-label="使用說明" title="使用說明">?</button>
<div id="help" class="help" hidden>
  <div id="spot" class="spot" hidden></div>
  <div class="hbox" role="dialog" aria-modal="true" aria-labelledby="hTitle">
    <i class="harr" id="hArr" hidden></i>
    <div class="hhead"><h2 id="hTitle"></h2><span class="hcount" id="hCount"></span></div>
    <div class="hbody" id="hBody"></div>
    <div class="hfoot">
      <button id="hSkip" type="button">結束導覽</button>
      <div class="hdots" id="hDots"></div>
      <button id="hPrev" type="button">上一步</button>
      <button id="hNext" type="button" class="pri">下一步</button>
    </div>
  </div>
</div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const PRESET={openai:["https://api.openai.com/v1","gpt-4o"],anthropic:["https://api.anthropic.com","claude-sonnet-4-5"],ollama:["http://localhost:11434/v1","qwen2.5"],puter:["","gpt-4o-mini"]};
const TOOLS=[
 {name:"list_dir",description:"列出資料夾內容，path 為相對路徑，根目錄用空字串。",props:{path:{type:"string"}},req:[]},
 {name:"read_file",description:"讀取文字檔。",props:{path:{type:"string"}},req:["path"]},
 {name:"write_file",description:"建立或覆寫文字檔，自動建立資料夾。",props:{path:{type:"string"},content:{type:"string"}},req:["path","content"]},
 {name:"search",description:"搜尋包含關鍵字的文字行。",props:{query:{type:"string"},path:{type:"string"}},req:["query"]},
 {name:"append_file",description:"在檔案末尾附加內容，檔案不存在則建立。",props:{path:{type:"string"},content:{type:"string"}},req:["path","content"]},
 {name:"replace_in_file",description:"將檔案中第一處 find 文字取代為 replace，適合小幅修改。",props:{path:{type:"string"},find:{type:"string"},replace:{type:"string"}},req:["path","find","replace"]},
 {name:"delete_file",description:"刪除單一檔案（每次都需使用者確認）。",props:{path:{type:"string"}},req:["path"]},
 {name:"read_xlsx",description:"讀取 Excel（.xlsx/.xls）內容，回傳每格位址與值（公式會顯示公式與結果）。sheet 可選，max_rows 預設 100、上限 300。",props:{path:{type:"string"},sheet:{type:"string"},max_rows:{type:"number"}},req:["path"]},
 {name:"diff_xlsx",description:"逐格比對兩個 Excel 檔（path_a 為舊、path_b 為新）並列出所有差異，sheet 可選。比對由程式完成，結果準確，請直接採用。",props:{path_a:{type:"string"},path_b:{type:"string"},sheet:{type:"string"}},req:["path_a","path_b"]},
 {name:"update_xlsx",description:"修改 Excel 儲存格。cells 為物件，例如 {\"B2\":\"新值\",\"C3\":100,\"D4\":\"=SUM(A1:A3)\"}；預設另存為「原檔名_updated.xlsx」，可用 output_path 指定。",props:{path:{type:"string"},sheet:{type:"string"},cells:{type:"object"},output_path:{type:"string"}},req:["path","cells"]},
 {name:"create_xlsx",description:"建立新的 Excel。rows 為二維陣列，例如 [[\"姓名\",\"分數\"],[\"小明\",90]]。",props:{path:{type:"string"},sheet:{type:"string"},rows:{type:"array",items:{type:"array",items:{}}}},req:["path","rows"]}
];
const TN={list_dir:"列目錄",read_file:"讀檔",write_file:"寫檔",search:"搜尋",append_file:"附加",replace_in_file:"取代",delete_file:"刪檔",read_xlsx:"讀Excel",diff_xlsx:"比對Excel",update_xlsx:"更新Excel",create_xlsx:"建立Excel"};
const TPL=[
 {name:"Excel 比對與更新員",sys:"你負責處理 Excel。先用 read_xlsx 了解結構；比對差異一律使用 diff_xlsx（不要自己逐格比較）；需要修改時用 update_xlsx，預設另存新檔，並在回覆中以表格列出改了哪些儲存格。",tools:["list_dir","read_xlsx","diff_xlsx","update_xlsx","create_xlsx"]},
 {name:"研究員",sys:"你負責蒐集並整理資料，條列重點並標示來源檔名，不做無根據的推論。",tools:["list_dir","read_file","search"]},
 {name:"程式碼審查員",sys:"你審查程式碼的正確性、安全性與可讀性，依嚴重程度列出問題與修改建議，並引用檔名與行號。",tools:["list_dir","read_file","search"]},
 {name:"翻譯員",sys:"你負責忠實翻譯，保留格式與專有名詞，並將譯文寫入檔案。",tools:["read_file","write_file"]},
 {name:"摘要員",sys:"你負責把長文濃縮成條理清楚的摘要，附上關鍵結論與待辦事項。",tools:["read_file"]}];

/* ---------- 狀態 ---------- */
let S={llms:[{id:"putter",name:"Putter AI",prov:"puter",base:"",key:"",model:"gpt-4o-mini"}],defLlm:"putter",cl:0,autoWrite:false,roles:[],flows:[],cf:0};
try{const x=JSON.parse(localStorage.getItem("xlx3")||"null");if(x)S=x}catch(e){}
const save=()=>{try{const f=S.flows.filter(x=>!x.tmp);localStorage.setItem("xlx3",JSON.stringify({...S,roles:S.roles.filter(r=>!r.tmp),flows:f,cf:S.flows[S.cf]&&!S.flows[S.cf].tmp?Math.min(S.cf,f.length-1):0}))}catch(e){}};
const llmOf=r=>S.llms.find(x=>x.id===r.llm)||S.llms.find(x=>x.id===S.defLlm)||S.llms[0];
const llmName=id=>(S.llms.find(x=>x.id===id)||S.llms[0]).name;
const llmOpts=v=>S.llms.map(l=>`<option value="${l.id}"${l.id==v?" selected":""}>${esc(l.name)}</option>`).join("");
let root=null,rootMsg="尚未選擇資料匣",busy=false,ctl=null,logs=[];
const idb=()=>new Promise((ok,no)=>{const r=indexedDB.open("xlx2",1);r.onupgradeneeded=()=>r.result.createObjectStore("h");r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
async function hPut(v){try{(await idb()).transaction("h","readwrite").objectStore("h").put(v,"root")}catch(e){}}
async function hGet(){try{const d=await idb();return await new Promise(ok=>{const r=d.transaction("h").objectStore("h").get("root");r.onsuccess=()=>ok(r.result);r.onerror=()=>ok(null)})}catch(e){return null}}
const uid=()=>"i"+Math.random().toString(36).slice(2,8);
const setPath=(p,v)=>{const k=p.split(".");let o=S;for(let i=0;i<k.length-1;i++)o=o[k[i]];o[k[k.length-1]]=v;save()};

/* ---------- 範例 ---------- */
function sample(){
  const r=(name,sys,tools,dir)=>({id:uid(),name,sys,tools,dir,llm:"",max:8});
  const a=r("收集員","你負責閱讀資料並條列重點，每點附上來源檔名。只陳述資料中有的內容，不做推測。",["list_dir","read_file","search"],"inbox");
  const b=r("撰稿員","依據提供的重點撰寫結構完整的文件，寫入檔案 draft.md，並在回覆中貼出全文。若收到審核意見，逐點修改。",["read_file","write_file"],"output");
  const c=r("審稿員","你是嚴格的審稿員，檢查每項論述是否有來源、結構是否清楚。第一行只能寫 PASS 或 FAIL，之後說明理由與具體修改建議。",["read_file"],"output");
  const d=r("歸檔員","把最終稿存成 final.md，並回報完成的檔案路徑。",["read_file","write_file"],"output");
  S.roles.push(a,b,c,d);
  S.flows.push({id:uid(),name:"資料整理 → 寫作 → 審稿",maxLoops:2,steps:[
    {role:a.id,type:"work",task:"讀取範圍內所有檔案，整理出重點清單。",gate:false},
    {role:b.id,type:"work",task:"根據重點撰寫完整文件。",gate:false},
    {role:c.id,type:"review",task:"審核上一步的文件是否合格。",gate:false},
    {role:d.id,type:"work",task:"將最終稿歸檔。",gate:true}]});
  S.cf=S.flows.length-1;save();
}

/* ---------- 側欄 ---------- */
const fld=(p,label,val,type="text")=>`<label>${label}<input type="${type}" data-p="${p}" value="${esc(val)}"></label>`;
const area=(p,label,val,rows=3)=>`<label>${label}<textarea rows="${rows}" data-p="${p}">${esc(val)}</textarea></label>`;

/* ---------- 紀錄 ---------- */
const log=$("#log");
function md(t){
  const bl=[];t=t.replace(/```[^\n]*\n([\s\S]*?)```/g,(_,c)=>{bl.push(c);return "\n\u0000"+(bl.length-1)+"\u0000\n"});
  const inl=x=>esc(x).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  const Ls=t.split("\n"),o=[],LI=/^\s*([-*]|\d+\.)\s+/,TB=/^\s*\|.*\|\s*$/;let i=0;
  while(i<Ls.length){
    const l=Ls[i];let m;
    if(/^\u0000\d+\u0000$/.test(l.trim())){o.push("<pre>"+esc(bl[+l.trim().slice(1,-1)])+"</pre>");i++}
    else if(m=l.match(/^(#{1,6})\s+(.*)/)){const n=Math.min(m[1].length+2,6);o.push("<h"+n+">"+inl(m[2])+"</h"+n+">");i++}
    else if(/^\s*(---+|\*\*\*+)\s*$/.test(l)){o.push("<hr>");i++}
    else if(TB.test(l)){const rows=[];while(i<Ls.length&&TB.test(Ls[i])){rows.push(Ls[i]);i++}
      const cells=r=>r.trim().replace(/^\||\|$/g,"").split("|").map(x=>x.trim());
      o.push("<table>"+rows.filter(r=>!/^\s*\|[\s:|-]+\|\s*$/.test(r)).map((r,k)=>"<tr>"+cells(r).map(c=>(k?"<td>":"<th>")+inl(c)+(k?"</td>":"</th>")).join("")+"</tr>").join("")+"</table>")}
    else if(LI.test(l)){const ord=/^\s*\d+\./.test(l),it=[];while(i<Ls.length&&LI.test(Ls[i])){it.push(Ls[i].replace(LI,""));i++}
      o.push((ord?"<ol>":"<ul>")+it.map(x=>"<li>"+inl(x)+"</li>").join("")+(ord?"</ol>":"</ul>"))}
    else if(/^>\s?/.test(l)){const q=[];while(i<Ls.length&&/^>\s?/.test(Ls[i])){q.push(Ls[i].replace(/^>\s?/,""));i++}o.push("<blockquote>"+q.map(inl).join("<br>")+"</blockquote>")}
    else if(!l.trim())i++;
    else{const p=[];while(i<Ls.length&&Ls[i].trim()&&!/^(#{1,6}\s|>|\u0000)/.test(Ls[i])&&!LI.test(Ls[i])&&!TB.test(Ls[i])&&!/^\s*---+\s*$/.test(Ls[i])){p.push(Ls[i]);i++}
      if(!p.length){p.push(Ls[i]);i++}o.push("<p>"+p.map(inl).join("<br>")+"</p>")}
  }
  return o.join("")}
const strip=x=>String(x).replace(/\*\*(.+?)\*\*/g,"$1").replace(/`([^`]+)`/g,"$1").replace(/\[([^\]]+)\]\([^)]+\)/g,"$1");
const titleOf=(t,n)=>{const m=t.match(/^#{1,6}\s+(.*)/m);return strip(m?m[1]:(n||"output")).trim()||"output"};
const fname=(t,n)=>titleOf(t,n).replace(/[\\\/:*?"<>|\s]+/g,"_").slice(0,40);

/* PDF：使用瀏覽器列印（可完整支援中文），在列印視窗選「另存為 PDF」 */
function toPdf(txt,name){
  const css='body{font:14px/1.7 "Noto Sans TC","Microsoft JhengHei",sans-serif;color:#111;margin:24px}h3{font-size:1.6em}h4{font-size:1.3em}h3,h4,h5,h6{margin:1em 0 .3em}pre{background:#f3f3f3;padding:8px;white-space:pre-wrap}code{background:#f3f3f3;padding:0 3px}table{border-collapse:collapse;margin:.5em 0}td,th{border:1px solid #bbb;padding:4px 8px}th{background:#eee}blockquote{border-left:3px solid #999;margin:.5em 0;padding-left:10px;color:#555}hr{border:0;border-top:1px solid #ccc}';
  const f=document.createElement("iframe");f.style.cssText="position:fixed;right:0;bottom:0;width:0;height:0;border:0";document.body.append(f);
  f.srcdoc='<!doctype html><meta charset="utf-8"><title>'+esc(titleOf(txt,name))+"</title><style>"+css+"</style>"+md(txt);
  f.onload=()=>setTimeout(()=>{f.contentWindow.focus();f.contentWindow.print();setTimeout(()=>f.remove(),60000)},250);
  setStat("請在列印視窗的「目的地」選擇「另存為 PDF」");
}

/* PPTX：把 Markdown 轉成投影片（以 --- 分頁；沒有 --- 則依 # / ## 標題分頁） */
let pptxP=null;
function loadPptx(){
  if(window.PptxGenJS)return Promise.resolve();if(pptxP)return pptxP;
  const urls=["https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js","https://cdnjs.cloudflare.com/ajax/libs/pptxgenjs/3.12.0/pptxgen.bundle.js"];
  pptxP=(async()=>{for(const u of urls){try{await new Promise((ok,no)=>{const e=document.createElement("script");e.src=u;e.onload=ok;e.onerror=no;document.head.append(e)});if(window.PptxGenJS)return}catch(e){}}throw new Error("無法載入 PPTX 產生器（pptxgenjs），請確認網路連線")})();
  pptxP.catch(()=>pptxP=null);return pptxP}
function mdSlides(txt){
  txt=txt.replace(/```[^\n]*\n([\s\S]*?)```/g,(_,c)=>c);
  const parts=/^\s*---+\s*$/m.test(txt)?txt.split(/^\s*---+\s*$/m):txt.split(/^(?=#{1,2}\s)/m);
  return parts.map(c=>c.trim()).filter(Boolean).map(c=>{
    let title="";const items=[],tbl=[];
    for(const raw of c.split("\n")){const l=raw.trimEnd();if(!l.trim())continue;let m;
      if(m=l.match(/^#{1,6}\s+(.*)/)){if(!title)title=m[1];else items.push({t:m[1],head:true});continue}
      if(/^\s*\|.*\|\s*$/.test(l)){if(!/^\s*\|[\s:|-]+\|\s*$/.test(l))tbl.push(l.trim().replace(/^\||\|$/g,"").split("|").map(x=>x.trim()));continue}
      if(m=l.match(/^(\s*)([-*]|\d+\.)\s+(.*)/)){items.push({t:m[3],bul:true,lv:Math.min(2,Math.floor(m[1].length/2))});continue}
      items.push({t:l.replace(/^>\s?/,"").trim()})}
    return{title,items,tbl}})}
async function toPptx(txt,name){
  await loadPptx();
  const slides=mdSlides(txt);if(!slides.length)throw new Error("沒有可轉換的內容");
  const p=new PptxGenJS();p.layout="LAYOUT_16x9";p.title=titleOf(txt,name);
  const F="標楷體",INK="17211F",AC="0F6B5C";
  slides.forEach((sl,idx)=>{
    const chunks=[];for(let k=0;k<Math.max(1,sl.items.length);k+=7)chunks.push(sl.items.slice(k,k+7));
    chunks.forEach((its,ci)=>{
      const s=p.addSlide();s.background={color:"FFFFFF"};
      s.addShape(p.ShapeType.rect,{x:0,y:0,w:0.18,h:5.625,fill:{color:AC}});
      const title=(sl.title||p.title)+(ci?"（續）":"");
      if(idx===0&&!ci&&!sl.items.some(x=>x.bul)&&!sl.tbl.length){
        s.addText(title,{x:0.8,y:1.6,w:8.4,h:1.4,fontFace:F,fontSize:36,bold:true,color:AC,fit:"shrink"});
        if(its.length)s.addText(its.map(x=>strip(x.t)).join("\n"),{x:0.8,y:3.1,w:8.4,h:1.6,fontFace:F,fontSize:18,color:"5D6B67",valign:"top",fit:"shrink"});
        return}
      s.addText(title,{x:0.5,y:0.3,w:9,h:0.9,fontFace:F,fontSize:28,bold:true,color:AC,fit:"shrink"});
      const hasT=sl.tbl.length&&!ci;
      if(its.length)s.addText(its.map(x=>{const o={breakLine:true,fontSize:its.length>5?16:18,color:INK,fontFace:F,bold:!!x.head};if(x.bul){o.bullet={indent:18};o.indentLevel=x.lv||0}return{text:strip(x.t),options:o}}),{x:0.5,y:1.3,w:9,h:hasT?1.9:3.8,valign:"top",fit:"shrink"});
      if(hasT)s.addTable(sl.tbl.map((r,ri)=>r.map(c=>{const o={bold:ri===0,fontFace:F,fontSize:13,color:INK};if(ri===0)o.fill={color:"E3EFE9"};return{text:strip(c),options:o}})),{x:0.5,y:its.length?3.3:1.4,w:9,border:{type:"solid",color:"D6DDDB",pt:1}});
    })});
  await p.writeFile({fileName:fname(txt,name)+".pptx"});
}

/* 下載按鈕列 */
function dlRow(txt,name){
  name=String(name||"").split(" · ")[0];
  const r=document.createElement("div");r.className="row dls";
  const mk=(t,fn)=>{const b=document.createElement("button");b.className="cp";b.textContent=t;b.onclick=async()=>{b.disabled=true;b.textContent="處理中…";try{await fn()}catch(e){alert(e.message||e)}b.disabled=false;b.textContent=t};r.append(b)};
  mk("複製",()=>navigator.clipboard.writeText(txt));
  mk("下載 MD",async()=>dl(txt,fname(txt,name)+".md"));
  mk("下載 PPTX",()=>toPptx(txt,name));
  mk("下載 PDF",async()=>toPdf(txt,name));
  return r}

/* 進度顯示 */
let chipSt=[],tick=null,t0s=0,statTxt="",stepSec=[];
const ST={wait:"待處理",run:"執行中",ok:"完成",bad:"退回修改",skip:"略過",err:"中斷"};
function progDraw(f){
  f=f||S.flows[S.cf];const pr=$("#prog");
  if(!f||!f.steps.length){pr.hidden=true;return}
  pr.hidden=false;
  const groups=[];f.steps.forEach((st,j)=>{if(j>0&&st.par&&st.type==="work")groups[groups.length-1].push(j);else groups.push([j])});
  const note=j=>{
    const st=f.steps[j],r=S.roles.find(x=>x.id===st.role),k=chipSt[j]||"wait",ri=Math.max(0,S.roles.indexOf(r));
    const fl=[st.type==="review"?"審核":"",st.par?"並行":"",st.gate?"🔒需核准":""].filter(Boolean).join("・");
    const extra=st.type==="review"?"未通過會退回（最多 "+(f.maxLoops||0)+" 次）":"";
    return `<div class="note c${ri%6} ${k}" data-j="${j}" tabindex="0" role="button" style="--rot:${j%2?1.2:-1.2}deg"><b>${j+1}. ${esc(r?r.name:"（角色已刪除）")}</b><span class="tk">${esc(st.task||"（依職責處理）")}</span><small>AI：${esc(r?llmOf(r).name:"?")}${fl?"・"+fl:""}</small>${extra?"<small>"+extra+"</small>":""}${stepSec[j]?"<small>耗時 "+stepSec[j]+" 秒</small>":""}${k!=="wait"?`<span class="stamp">${ST[k]}</span>`:""}</div>`};

  async write_file(b,{path,content}){

  async search(b,{query,path}){const q=query.toLowerCase(),out=[],pa=parts(path);
    await walk(await dirAt(b,pa),pa.join("/")+(pa.length?"/":""),async(h,p)=>{if(out.length>=50)return;const f=await h.getFile();if(f.size>200000)return;let t;try{t=await f.text()}catch(e){return}if(t.includes("\0"))return;t.split("\n").forEach((l,i)=>{if(out.length<50&&l.toLowerCase().includes(q))out.push(p+":"+(i+1)+": "+l.trim().slice(0,160))})},{n:0});

  async replace_in_file(b,{path,find,replace}){const a=parts(path),n=a.pop();const d=await dirAt(b,a);const fh=await d.getFileHandle(n);const old=await(await fh.getFile()).text();

/* ---------- Excel 工具（SheetJS） ---------- */
const BIN=/\.(xlsx|xlsm|xls|docx|pptx|pdf|zip|png|jpe?g|gif|webp|exe|7z)$/i;
let xlsxP=null;
function loadXlsx(){if(window.XLSX)return Promise.resolve();if(xlsxP)return xlsxP;
  const urls=["https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js","https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"];
  xlsxP=(async()=>{for(const u of urls){try{await new Promise((ok,no)=>{const e=document.createElement("script");e.src=u;e.onload=ok;e.onerror=no;document.head.append(e)});if(window.XLSX)return}catch(e){}}throw new Error("無法載入 Excel 元件（SheetJS），請確認網路連線")})();
  xlsxP.catch(()=>xlsxP=null);return xlsxP}
async function wbOf(b,path){await loadXlsx();const a=parts(path),n=a.pop();const f=await(await(await dirAt(b,a)).getFileHandle(n)).getFile();return XLSX.read(await f.arrayBuffer(),{type:"array",cellFormula:true,cellDates:true})}
const cv=c=>c==null?"":(c.w!=null?c.w:c.v);
const cf=c=>c?(c.f?"="+c.f+"→"+cv(c):String(cv(c))):"";
async function saveWb(b,path,wb){const a=parts(path),n=a.pop();const out=XLSX.write(wb,{type:"array",bookType:"xlsx"});const w=await(await(await dirAt(b,a,true)).getFileHandle(n,{create:true})).createWritable();await w.write(out);await w.close()}
Object.assign(impl,{
  async read_xlsx(b,{path,sheet,max_rows}){
    const wb=await wbOf(b,path),names=sheet?[sheet]:wb.SheetNames,lim=Math.min(+max_rows||100,300);let o="工作表："+wb.SheetNames.join("、")+"\n";
    for(const nm of names){const ws=wb.Sheets[nm];if(!ws){o+="\n找不到工作表："+nm+"\n";continue}
      const rg=XLSX.utils.decode_range(ws["!ref"]||"A1");o+="\n## "+nm+"（範圍 "+(ws["!ref"]||"空")+"）\n";
      for(let r=rg.s.r;r<=Math.min(rg.e.r,rg.s.r+lim-1);r++){const cells=[];for(let c=rg.s.c;c<=rg.e.c;c++){const k=XLSX.utils.encode_cell({r,c}),x=ws[k];if(x)cells.push(k+"="+cf(x))}if(cells.length)o+=cells.join(" | ")+"\n"}
      if(rg.e.r-rg.s.r+1>lim)o+="…（僅顯示前 "+lim+" 列，可用 max_rows 調整，上限 300）\n"}
    return o.slice(0,60000)},
  async diff_xlsx(b,{path_a,path_b,sheet}){
    const A=await wbOf(b,path_a),B=await wbOf(b,path_b),out=[];
    const names=[...new Set([...A.SheetNames,...B.SheetNames])].filter(x=>!sheet||x===sheet);
    for(const nm of names){const a=A.Sheets[nm],bb=B.Sheets[nm];
      if(!a){out.push("【新增工作表】"+nm+"（僅在 B）");continue}if(!bb){out.push("【刪除工作表】"+nm+"（僅在 A）");continue}
      const ra=XLSX.utils.decode_range(a["!ref"]||"A1"),rb=XLSX.utils.decode_range(bb["!ref"]||"A1"),er=Math.max(ra.e.r,rb.e.r),ec=Math.max(ra.e.c,rb.e.c);let n=0;
      for(let r=0;r<=er&&out.length<400;r++)for(let c=0;c<=ec&&out.length<400;c++){const k=XLSX.utils.encode_cell({r,c}),x=cf(a[k]),y=cf(bb[k]);if(x!==y){n++;out.push(nm+"!"+k+"：A="+(x||"（空）")+" → B="+(y||"（空）"))}}
      if(!n)out.push("【"+nm+"】兩邊內容相同")}
    return (out.length>=400?"（差異過多，僅列前 400 筆）\n":"")+(out.join("\n")||"兩個檔案沒有差異")},
  async update_xlsx(b,{path,sheet,cells,output_path}){
    if(!cells||typeof cells!=="object")throw new Error('cells 必須是物件，例如 {"B2":"新值","C3":100}');
    const wb=await wbOf(b,path),nm=sheet||wb.SheetNames[0];let ws=wb.Sheets[nm];
    if(!ws){ws=XLSX.utils.aoa_to_sheet([[]]);XLSX.utils.book_append_sheet(wb,ws,nm)}
    let n=0;
    for(const [k,v] of Object.entries(cells)){if(!/^[A-Za-z]{1,3}[0-9]{1,7}$/.test(k))throw new Error("儲存格位址不正確："+k);const ad=k.toUpperCase();
      ws[ad]=typeof v==="number"?{t:"n",v}:(typeof v==="string"&&v.startsWith("="))?{t:"n",f:v.slice(1),v:0,_f:1}:{t:"s",v:String(v)};n++;
      const d=XLSX.utils.decode_cell(ad),rg=XLSX.utils.decode_range(ws["!ref"]||"A1");rg.e.r=Math.max(rg.e.r,d.r);rg.e.c=Math.max(rg.e.c,d.c);ws["!ref"]=XLSX.utils.encode_range(rg)}
    const outp=output_path||path.replace(/(\.xls[xm]?)?$/i,"_updated.xlsx");
    if(!S.autoWrite&&!confirm("更新 Excel：修改 "+n+" 格，另存為 /"+parts(outp).join("/")+"\n（注意：儲存格樣式可能無法完整保留）\n允許嗎？"))return "使用者拒絕寫入。";
    const hasF=Object.values(cells).some(v=>typeof v==="string"&&v.startsWith("="));
    if(hasF){wb.Workbook=wb.Workbook||{};wb.Workbook.CalcPr={fullCalcOnLoad:true}}
    await saveWb(b,outp,wb);return "已修改 "+n+" 格，並儲存為 /"+parts(outp).join("/")+(hasF?"（含公式：結果會在用 Excel 開啟後重新計算，目前顯示的 0 只是占位）":"")},
  async create_xlsx(b,{path,sheet,rows}){
    if(!Array.isArray(rows))throw new Error('rows 必須是二維陣列，例如 [["姓名","分數"],["小明",90]]');
    await loadXlsx();if(!/\.xlsx$/i.test(path))path+=".xlsx";
    if(!S.autoWrite&&!confirm("建立 Excel：/"+parts(path).join("/")+"（"+rows.length+" 列）\n允許嗎？"))return "使用者拒絕寫入。";
    const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),sheet||"Sheet1");await saveWb(b,path,wb);return "已建立 /"+parts(path).join("/")}
});

/* ---------- LLM 轉接 ---------- */
async function post(url,headers,body){
  for(let k=0;;k++){
    const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json",...headers},body:JSON.stringify(body),signal:ctl.signal});
    const t=await r.text();if(r.ok)return JSON.parse(t);
    if((r.status===429||r.status>=500)&&k<2){await new Promise(ok=>setTimeout(ok,1500*(k+1)));continue}
    throw new Error("HTTP "+r.status+"："+t.slice(0,300));
  }}
function loadPuter(){return window.puter?Promise.resolve():new Promise((ok,no)=>{const s=document.createElement("script");s.src="https://js.puter.com/v2/";s.onload=ok;s.onerror=()=>no(new Error("無法載入 puter.js，請確認網路連線"));document.head.append(s)})}
async function promptChat(c,h,tools,sys){
  if(c.prov==="puter")await loadPuter();
  let s=sys;
  if(tools.length)s+="\n\n你可以呼叫工具。需要時只輸出下列格式的區塊（可多個），輸出後立刻停止，等待結果：\n```tool\n{\"name\":\"工具名\",\"args\":{\"參數\":\"值\"}}\n```\n可用工具：\n"+tools.map(t=>"- "+t.name+"（"+t.description+"）參數："+Object.keys(t.props).join("、")).join("\n");
  const msgs=[{role:"system",content:s}];
  for(const m of h){
    if(m.r==="u")msgs.push({role:"user",content:m.t});
    else if(m.r==="a")msgs.push({role:"assistant",content:(m.t||"")+(m.calls||[]).map(x=>"\n```tool\n"+JSON.stringify({name:x.name,args:x.args})+"\n```").join("")});
    else msgs.push({role:"user",content:"【工具結果】\n"+m.results.map(r=>r.name+"：\n"+r.out).join("\n---\n")});
  }
  let t;
  if(c.prov==="puter"){
    const r=await puter.ai.chat(msgs,{model:c.model});
    if(ctl&&ctl.signal.aborted){const e=new Error("abort");e.name="AbortError";throw e}
    const c0=r&&r.message?r.message.content:r;
    t=typeof c0==="string"?c0:Array.isArray(c0)?c0.map(x=>x.text||"").join(""):String(r);
  }else{
    const base=c.base.replace(/\/+$/,"");
    if(c.prov==="anthropic"){
      const j=await post(base+"/v1/messages",{"x-api-key":c.key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},{model:c.model,max_tokens:4096,system:s,messages:msgs.slice(1)});
      t=j.content.filter(x=>x.type==="text").map(x=>x.text).join("\n");
    }else{
      const j=await post(base+"/chat/completions",c.key?{Authorization:"Bearer "+c.key}:{},{model:c.model,messages:msgs});
      t=j.choices[0].message.content||"";
    }
  }
  const calls=[];
  t=t.replace(/```tool\s*([\s\S]*?)```/g,(_,j)=>{try{const o=JSON.parse(j);if(o.name)calls.push({id:uid(),name:o.name,args:o.args||{}})}catch(e){}return""}).trim();
  return{t,calls};
}
async function llm(c,h,tools,sys){
  if(c.prov==="puter"||(tools.length&&c.tm==="prompt"))return promptChat(c,h,tools,sys);
  try{return await nativeLlm(c,h,tools,sys)}
  catch(e){
    if(tools.length&&c.tm!=="native"&&/does not support tool|not support tool|tools? (is |are )?not supported|不支援/i.test(e.message)){
      c.tm="prompt";save();L("s","「"+c.name+"」的模型不支援原生工具呼叫，已自動改用提示詞模式（已記住，可在 AI 設定中修改）。");
      return promptChat(c,h,tools,sys);
    }
    throw e;
  }
}
async function nativeLlm(c,h,tools,sys){
  const base=c.base.replace(/\/+$/,"");
  if(c.prov==="anthropic"){
    const msgs=h.map(m=>m.r==="u"?{role:"user",content:m.t}:m.r==="a"?{role:"assistant",content:[...(m.t?[{type:"text",text:m.t}]:[]),...(m.calls||[]).map(x=>({type:"tool_use",id:x.id,name:x.name,input:x.args}))]}:{role:"user",content:m.results.map(r=>({type:"tool_result",tool_use_id:r.id,content:r.out}))});
    const body={model:c.model,max_tokens:4096,system:sys,messages:msgs};
    if(tools.length)body.tools=tools.map(t=>({name:t.name,description:t.description,input_schema:{type:"object",properties:t.props,required:t.req}}));
    const j=await post(base+"/v1/messages",{"x-api-key":c.key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body);
    return{t:j.content.filter(x=>x.type==="text").map(x=>x.text).join("\n"),calls:j.content.filter(x=>x.type==="tool_use").map(x=>({id:x.id,name:x.name,args:x.input||{}}))};
  }
  const msgs=[{role:"system",content:sys}];
  for(const m of h){if(m.r==="u")msgs.push({role:"user",content:m.t});else if(m.r==="a"){const o={role:"assistant",content:m.t||null};if(m.calls&&m.calls.length)o.tool_calls=m.calls.map(x=>({id:x.id,type:"function",function:{name:x.name,arguments:JSON.stringify(x.args)}}));msgs.push(o)}else m.results.forEach(r=>msgs.push({role:"tool",tool_call_id:r.id,content:r.out}))}
  const body={model:c.model,messages:msgs};
  if(tools.length)body.tools=tools.map(t=>({type:"function",function:{name:t.name,description:t.description,parameters:{type:"object",properties:t.props,required:t.req}}}));
  const j=await post(base+"/chat/completions",c.key?{Authorization:"Bearer "+c.key}:{},body);
  const m=j.choices[0].message;
  return{t:m.content||"",calls:(m.tool_calls||[]).map(x=>{let g={};try{g=JSON.parse(x.function.arguments||"{}")}catch(e){}return{id:x.id,name:x.function.name,args:g}})};
}

function gate(title,text){

    setStat("等待你核准…");const d=L("h gate","",title),ta=document.createElement("textarea");ta.value=text;ta.style.width="100%";

async function runFlow(){
  const f=S.flows[S.cf],goal=$("#goal").value.trim();
  if(!goal){alert("請先輸入總目標");return}
  busy=true;ctl=new AbortController();$("#run").hidden=true;$("#auto").hidden=true;$("#stop").hidden=false;log.innerHTML="";document.body.dataset.v="run";
  const t0=Date.now(),stamp=new Date().toISOString().slice(0,16).replace(/[:T]/g,"-");
  logs=["# 執行紀錄：「"+f.name+"」\n總目標："+goal];
  let i=+$("#from").value||0,prev=i?"（從第 "+(i+1)+" 步開始，無前一步輸出）":"",work="",fb="",loops=0,lastWork=-1;
  L("s","流程開始：「"+f.name+"」"+(i?"，從第 "+(i+1)+" 步起":""));progInit(f,i);t0s=Date.now();clearInterval(tick);tick=setInterval(drawStat,1000);setStat("準備中…");
  const saveOut=async(n,role,out)=>{if(!S.saveRuns)return;try{const d=await(await root.getDirectoryHandle("_runs",{create:true})).getDirectoryHandle(stamp,{create:true});const w=await(await d.getFileHandle("step"+n+"-"+role.name.replace(/[\\\/:*?"<>|\s]/g,"_")+".md",{create:true})).createWritable();await w.write(out);await w.close()}catch(e){}};
  try{
    while(i<f.steps.length){
      const s0=f.steps[i],role0=S.roles.find(r=>r.id===s0.role);
      if(!role0){L("e","第 "+(i+1)+" 步的角色已被刪除");break}
      const grp=[i];
      if(s0.type==="work")while(f.steps[grp[grp.length-1]+1]&&f.steps[grp[grp.length-1]+1].par&&f.steps[grp[grp.length-1]+1].type==="work")grp.push(grp[grp.length-1]+1);
      if(s0.gate){const g=await gate("第 "+(i+1)+" 步前的人工核准（"+role0.name+"）",prev||"（尚無前一步輸出）");if(g===null){L("s","已由使用者終止。");break}prev=g}
      const one=async idx=>{
        const st=f.steps[idx],role=S.roles.find(r=>r.id===st.role);
        if(!role)throw new Error("第 "+(idx+1)+" 步的角色已被刪除");
        let msg="【總目標】\n"+goal+"\n\n【本步驟任務】\n"+(st.task||"依職責處理")+"\n\n【上一步輸出】\n"+(prev||"（無）"),extra="";
        if(st.type==="review"){extra="\n第一行只能寫 PASS 或 FAIL，之後才說明理由。";msg+="\n\n請審核「上一步輸出」。"}
        else if(fb)msg+="\n\n【審核意見，請逐點修改】\n"+fb+"\n\n【你上一版的輸出】\n"+work;
        L("s","第 "+(idx+1)+" 步 · "+role.name+(st.type==="review"?"（審核）":"")+" ｜AI："+llmOf(role).name+(grp.length>1?" ｜並行":""));
        setSt(idx,"run");const t=Date.now(),out=await agent(role,msg,extra,"第 "+(idx+1)+" 步");
        {const card=L("a",out,role.name+" · "+((Date.now()-t)/1000).toFixed(1)+" 秒");card.dataset.step=idx}stepSec[idx]=((Date.now()-t)/1000).toFixed(1);setSt(idx,"ok");
        await saveOut(idx+1,role,out);
        return out;
      };
      const outs=await Promise.all(grp.map(one));
      if(s0.type==="review"){
        const out=outs[0];
        if(/^\s*PASS/i.test(out)){prev=work||prev;i++}
        else if(loops<(f.maxLoops||0)&&lastWork>=0){loops++;fb=out;setSt(i,"bad");for(let j=lastWork;j<i;j++)setSt(j,"wait");L("s","審核未通過，退回第 "+(lastWork+1)+" 步（第 "+loops+"/"+f.maxLoops+" 次）");prev=work;i=lastWork}
        else{L("e","審核未通過且已達退回上限，流程繼續往下。");prev=work||prev;i++}
      }else{
        work=outs.length>1?outs.map((o,k)=>"## "+S.roles.find(r=>r.id===f.steps[grp[k]].role).name+"\n"+o).join("\n\n"):outs[0];
        prev=work;lastWork=i;fb="";i=grp[grp.length-1]+1;
      }
    }
    L("s","流程結束，共 "+((Date.now()-t0)/1000).toFixed(1)+" 秒。");finalCard(prev);
  }catch(e){L("e",e.name==="AbortError"?"已停止。":"執行失敗："+e.message+"\n請檢查 API 網址、Key、模型，以及該服務是否允許瀏覽器直接連線。")}
  pushHist(f.name,goal);
  clearInterval(tick);chipSt=chipSt.map(x=>x==="run"?"err":x);progDraw(f);busy=false;setStat("結束，共 "+Math.floor((Date.now()-t0s)/1000)+" 秒");$("#run").hidden=false;$("#auto").hidden=false;$("#stop").hidden=true;ready();
}
$("#run").onclick=runFlow;
$("#stop").onclick=()=>ctl&&ctl.abort();

function helpPlace(){
  const box=document.querySelector(".hbox"),spot=$("#spot"),arr=$("#hArr"),help=$("#help");
  if(help.hidden)return;
  let el=helpRaw(HELP[hi]);if(el&&!el.getClientRects().length)el=null;
  const vw=innerWidth,vh=innerHeight,m=12;
  box.style.maxHeight=Math.min(vh-2*m,620)+"px";
  const bw=box.offsetWidth,bh=box.offsetHeight;
  if(!el){
    spot.hidden=true;arr.hidden=true;help.classList.add("dim");
    box.style.left=Math.max(m,(vw-bw)/2)+"px";box.style.top=Math.max(m,(vh-bh)/2)+"px";return;
  }
  help.classList.remove("dim");
  const r=el.getBoundingClientRect(),p=6,g=16;
  spot.hidden=false;
  Object.assign(spot.style,{left:r.left-p+"px",top:r.top-p+"px",width:r.width+2*p+"px",height:r.height+2*p+"px"});
  let x,y,cls="";
  if(vw-r.right>=bw+g+p+m){cls="al";x=r.right+p+g;y=r.top}
  else if(vh-r.bottom>=bh+g+p+m){cls="au";y=r.bottom+p+g;x=r.left}
  else if(r.top>=bh+g+p+m){cls="ad";y=r.top-p-g-bh;x=r.left}
  else if(r.left>=bw+g+p+m){cls="ar";x=r.left-p-g-bw;y=r.top}
  else{x=(vw-bw)/2;y=vh-bh-m}
  x=Math.min(Math.max(m,x),vw-bw-m);y=Math.min(Math.max(m,y),vh-bh-m);
  box.style.left=x+"px";box.style.top=y+"px";
  if(!cls){arr.hidden=true;return}
  const cx=(Math.max(r.left,0)+Math.min(r.right,vw))/2,cy=(Math.max(r.top,0)+Math.min(r.bottom,vh))/2;
  const cl=(v,a,b)=>Math.min(Math.max(v,a),b);
  arr.hidden=false;arr.className="harr "+cls;arr.style.left=arr.style.top="";
  if(cls==="al"||cls==="ar")arr.style.top=cl(cy-y-6,14,bh-26)+"px";
  else arr.style.left=cl(cx-x-6,14,bw-26)+"px";

/* ---------- 智慧規劃：口語 → 角色／工具／步驟 ---------- */
const PLAN_SYS="你是工作流規劃師。使用者用口語描述需求，請把它轉成可執行的計畫，只輸出一個 JSON，不要其他文字。\n規則：\n1. 只能使用【可用工具】中的工具名稱。\n2. 步驟數 1 到 5，每步指定一位角色；能一步完成就不要拆。\n3. 要比對或修改 Excel 時，用 diff_xlsx、update_xlsx、read_xlsx；不可用 read_file 讀 Excel。\n4. 需要簡報時，任務中要求以 Markdown 輸出並用 --- 分頁，並寫明張數。\n5. 檔名請對照【資料匣檔案】；找不到或有歧義的檔名，放進 questions。\n6. 會修改、覆寫或刪除檔案的步驟，gate 設為 true。\n7. 若需求與【現有流程】之一相符，use_flow 填該流程名稱，steps 可為空陣列。\n8. 審核步驟 type 設為 review，且不可是第一步。\n輸出格式：{\"summary\":\"一句話說明你理解的需求\",\"use_flow\":null,\"questions\":[],\"steps\":[{\"role\":\"角色名\",\"sys\":\"角色職責\",\"tools\":[\"工具名\"],\"dir\":\"\",\"type\":\"work\",\"task\":\"本步驟具體任務，含檔名與輸出格式\",\"gate\":false}]}";
async function snap(){const o=[];async function w(d,pre,dep){for await(const [n,h] of d.entries()){if(o.length>80)return;if(n.startsWith("."))continue;o.push(pre+n+(h.kind==="directory"?"/":""));if(h.kind==="directory"&&dep<2&&!n.startsWith("_"))await w(h,pre+n+"/",dep+1)}}await w(root,"",0);return o.join("\n")}
async function makePlan(goal,extra){
  ctl=new AbortController();
  const cfg=S.llms.find(x=>x.id===S.defLlm)||S.llms[0];
  const flows=S.flows.filter(f=>!f.tmp).map(f=>"- "+f.name+"："+f.steps.map(x=>x.task).join(" → ").slice(0,80)).join("\n")||"（無）";
  const msg="【使用者需求】\n"+goal+(extra?"\n【補充】\n"+extra:"")+"\n\n【可用工具】\n"+TOOLS.map(t=>"- "+t.name+"："+t.description).join("\n")+"\n\n【現有流程】\n"+flows+"\n\n【資料匣檔案】\n"+((await snap())||"（空）");
  const r=await llm(cfg,[{r:"u",t:msg}],[],PLAN_SYS);
  const m=r.t.match(/\{[\s\S]*\}/);if(!m)throw new Error("AI 的規劃結果不是 JSON");
  return JSON.parse(m[0]);
}
async function normPlan(p){
  const q=Array.isArray(p.questions)?p.questions.map(String):[];
  if(p.use_flow){const f=S.flows.find(x=>!x.tmp&&x.name===p.use_flow);if(f)return{summary:p.summary||f.name,flow:f,questions:q}}
  const steps=(Array.isArray(p.steps)?p.steps:[]).slice(0,6);if(!steps.length)throw new Error("規劃沒有產生任何步驟");
  const known=TOOLS.map(t=>t.name);
  for(const x of steps){x.tools=(Array.isArray(x.tools)?x.tools:[]).filter(t=>known.includes(t));x.type=x.type==="review"?"review":"work";x.role=String(x.role||"助理").slice(0,20);x.task=String(x.task||"");
    if(x.dir){try{let d=root;for(const n of parts(x.dir))d=await d.getDirectoryHandle(n)}catch(e){x.dir=""}}else x.dir=""}
  if(steps[0].type==="review")steps[0].type="work";
  return{summary:String(p.summary||"自動規劃"),steps,questions:q}}
const fallbackPlan=g=>({summary:g.slice(0,30),questions:[],steps:[{role:"全能助理",sys:"你是萬用助理，先查看資料匣再動手，依需求選擇合適的工具。Excel 檔用 read_xlsx、diff_xlsx、update_xlsx，不要用 read_file。",tools:/xlsx?|excel|試算表|表格/i.test(g)?["list_dir","read_file","search","write_file","read_xlsx","diff_xlsx","update_xlsx","create_xlsx"]:["list_dir","read_file","search","write_file","append_file"],dir:"",type:"work",task:g,gate:false}]});
function planCard(pl){return new Promise(ok=>{
  const d=L("h gate","","智慧規劃：我是這樣理解的"),box=document.createElement("div");box.className="md";
  const steps=pl.flow?pl.flow.steps.map(x=>{const r=S.roles.find(y=>y.id===x.role)||{name:"?",tools:[]};return{role:r.name,task:x.task,tools:r.tools,type:x.type,gate:x.gate}}):pl.steps;
  box.innerHTML="<p><b>"+esc(pl.summary)+"</b></p>"+(pl.flow?"<p>將使用你現有的流程「"+esc(pl.flow.name)+"」。</p>":"")+"<ol>"+steps.map(x=>"<li><b>"+esc(x.role)+"</b>"+(x.type==="review"?"（審核）":"")+"："+esc(x.task)+"<br><small>會用到："+(x.tools.map(t=>TN[t]||t).join("、")||"不使用工具")+(x.gate?"・🔒 執行前會先問你":"")+"</small></li>").join("")+"</ol>"+(pl.questions.length?'<p style="color:var(--warn)">⚠ 請確認：'+pl.questions.map(esc).join("；")+"</p>":"");
  const ta=document.createElement("textarea");ta.placeholder="補充說明（選填，例如指定檔名），再按「依補充重新規劃」";ta.style.cssText="width:100%;height:56px;margin:6px 0";
  const r=document.createElement("div");r.className="row";
  const mk=(t,c,v)=>{const b=document.createElement("button");b.textContent=t;if(c)b.className=c;b.onclick=()=>{d.querySelectorAll("button,textarea").forEach(x=>x.disabled=true);ok(v==="redo"?{redo:ta.value.trim()}:v)};r.append(b)};
  mk("確認並執行","pri",{go:1});mk("依補充重新規劃",null,"redo");mk("取消",null,null);
  d.append(box,ta,r);log.scrollTop=1e9})}
$("#auto").onclick=async()=>{
  const goal=$("#goal").value.trim();
  if(!goal){alert("請先用一句話描述你想做什麼");return}
  if(!root){alert("請先在設定頁選擇資料匣");return}
  document.body.dataset.v="run";busy=true;ready();$("#auto").hidden=true;$("#run").hidden=true;log.innerHTML="";logs=[];$("#prog").hidden=true;$("#stat").textContent="";
  const fin=()=>{busy=false;$("#auto").hidden=false;$("#run").hidden=false;ready()};
  let pl=null,extra="";
  try{
    for(let k=0;k<4;k++){
      L("s","正在理解你的需求並規劃步驟…");let raw;
      try{raw=await normPlan(await makePlan(goal,extra))}catch(e){L("s","規劃失敗（"+e.message+"），改用單一全能助理處理。");raw=await normPlan(fallbackPlan(goal))}
      const r=await planCard(raw);
      if(r&&r.redo!==undefined){extra=r.redo;continue}
      if(r&&r.go)pl=raw;break}
  }catch(e){L("e","規劃失敗："+e.message);fin();return}
  if(!pl){L("s","已取消。");fin();return}
  S.roles=S.roles.filter(r=>!r.tmp);S.flows=S.flows.filter(f=>!f.tmp);
  let f;
  if(pl.flow)f=pl.flow;
  else{const map={};
    pl.steps.forEach(x=>{const m=map[x.role]||(map[x.role]={id:uid(),name:x.role,sys:x.sys||"",tools:[],dir:x.dir||"",llm:"",max:8,tmp:true});m.tools=[...new Set([...m.tools,...x.tools])]});
    S.roles.push(...Object.values(map));
    f={id:uid(),name:"（智慧）"+pl.summary.slice(0,18),maxLoops:2,tmp:true,steps:pl.steps.map(x=>({role:map[x.role].id,type:x.type,task:x.task,gate:!!x.gate,par:false}))};S.flows.push(f)}
  S.cf=S.flows.indexOf(f);busy=false;render();
  await runFlow();
  if(f.tmp){const d=L("h","","想重複使用這個流程？"),b=document.createElement("button");b.textContent="儲存為我的流程";b.onclick=()=>{S.roles.forEach(r=>delete r.tmp);delete f.tmp;f.name=f.name.replace("（智慧）","");save();render();b.disabled=true;b.textContent="已儲存"};d.append(b)}
};
const EX=["比對 舊版.xlsx 和 新版.xlsx 有什麼不同","把 inbox 裡的文件整理成重點摘要","把 report.md 翻成英文並另存","根據資料夾內容做一份 8 張的簡報"];

$("#ex").onclick=e=>{const b=e.target.closest(".ex");if(b){$("#goal").value=b.textContent;$("#goal").focus()}};

/* ---------- 啟動 ---------- */
const jump=n=>{const c=[...log.querySelectorAll('[data-step="'+n.dataset.j+'"]')].pop();if(c){document.body.dataset.v="run";c.scrollIntoView({behavior:"smooth",block:"start"})}};
$("#chips").addEventListener("click",e=>{const n=e.target.closest(".note");if(n)jump(n)});

$("#ptog").onclick=()=>{const c=$("#prog").classList.toggle("col");$("#ptog").textContent=c?"展開便利貼":"收合便利貼"};
$("#tabs").onclick=e=>{const b=e.target.closest("button");if(!b)return;document.body.dataset.v=b.dataset.v;document.querySelectorAll("#tabs button").forEach(x=>x.classList.toggle("on",x===b))};
new MutationObserver(()=>document.querySelectorAll("#tabs button").forEach(x=>x.classList.toggle("on",x.dataset.v===document.body.dataset.v))).observe(document.body,{attributes:true,attributeFilter:["data-v"]});
