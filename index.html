<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小蝦 v4 · 多角色工作流</title>
<style>
:root{--bg:#f3f5f4;--panel:#fff;--ink:#17211f;--mute:#5d6b67;--line:#d6dddb;--accent:#0f6b5c;--accent-ink:#fff;--tool:#eef3f1;--warn:#a8431f;--soft:#e3efe9}
@media (prefers-color-scheme:dark){:root{--bg:#121816;--panel:#1a2320;--ink:#e6eeeb;--mute:#93a39e;--line:#2b3733;--accent:#4fc3a8;--accent-ink:#06211b;--tool:#202b28;--warn:#e88b65;--soft:#22342e}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}body{height:100dvh}
body{font:14px/1.55 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;background:var(--bg);color:var(--ink);display:grid;grid-template-columns:clamp(320px,30vw,420px) 1fr;overflow:hidden}
aside{background:var(--panel);border-right:1px solid var(--line);padding:14px;overflow:auto}
main{display:flex;flex-direction:column;min-width:0;height:100%}
h1{font-size:18px;margin:0 0 10px}
section>summary{font-weight:600;cursor:pointer;padding:6px 0}
section{border-top:1px solid var(--line);padding:4px 0}
label{display:block;font-size:12px;color:var(--mute);margin:8px 0 2px}
input,select,textarea,button{font:inherit;color:inherit}
input[type=text],input[type=password],input[type=number],select,textarea{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
textarea{resize:vertical}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);padding:6px 10px;border-radius:6px}
button.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.row>select,.row>input{flex:1;width:auto}
.chk{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--ink);margin:6px 12px 0 0}
.card{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:8px 0;background:var(--bg)}
.card>summary{cursor:pointer;font-weight:600}
.step{border-left:3px solid var(--accent)}
.folder{font-size:13px;margin-top:6px;word-break:break-all}.bad{color:var(--warn)}
.bar{display:flex;gap:8px;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--panel);align-items:flex-start}
.bar textarea{flex:1;height:58px}
#log{flex:1;overflow:auto;padding:16px max(16px,calc((100% - 820px)/2))}
.m{margin:0 0 12px;padding:9px 13px;border-radius:10px;white-space:pre-wrap;word-break:break-word;background:var(--panel);border:1px solid var(--line)}
.m .who{display:block;font-size:12px;color:var(--accent);margin-bottom:2px}.m.md{white-space:normal}.md h3,.md h4,.md h5,.md h6{margin:.6em 0 .2em;font-size:1em}.md pre{background:var(--tool);padding:8px;border-radius:6px;overflow:auto;white-space:pre-wrap}.md code{background:var(--tool);padding:0 4px;border-radius:4px}.md .li{padding-left:.5em}.cp{display:block;margin-top:6px;font-size:12px;padding:3px 8px;min-height:0}#tabs{display:none}
.m.h{background:var(--soft);border-color:var(--accent)}
.m.e{border-color:var(--warn);color:var(--warn)}
.m.s{background:none;border:0;color:var(--mute);padding:2px 4px;font-size:13px}
details.t{margin:0 0 10px;background:var(--tool);border-radius:8px;padding:5px 12px;font-size:12px}
details.t summary{cursor:pointer;color:var(--mute)}
details.t pre{margin:6px 0;white-space:pre-wrap;word-break:break-all;max-height:200px;overflow:auto}
.gate textarea{height:140px;margin:6px 0}
@media (max-width:900px){
body{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
#tabs{display:flex;background:var(--panel);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
#tabs button{flex:1;border:0;border-radius:0;padding:12px;font-weight:600;background:none}
#tabs button.on{color:var(--accent);box-shadow:inset 0 -3px var(--accent)}
aside,main{grid-row:2;grid-column:1;min-height:0}
body[data-v="run"] aside{display:none}body[data-v="set"] main{display:none}
aside{border:0;padding:12px 14px calc(18px + env(safe-area-inset-bottom))}
input,select,textarea{font-size:16px}button{min-height:40px}
.bar{flex-direction:column;padding:10px 12px}.bar textarea{width:100%;flex:none}
.bar .acts{flex-direction:row!important;flex-wrap:wrap;align-items:stretch!important;width:100%}
.bar .acts>*{flex:1 1 140px}
#log{padding:12px}
}
</style>
</head>
<body data-v="set">
<div id="tabs"><button data-v="set" class="on">設定</button><button data-v="run">執行</button></div>
<aside id="side"></aside>
<main>
  <div class="bar">
    <textarea id="goal" placeholder="輸入這次流程的總目標，例如：整理 inbox 內的會議記錄，產出本週摘要"></textarea>
    <div class="row acts" style="flex-direction:column;align-items:stretch">
      <button class="pri" id="run">執行流程</button><button id="stop" hidden>停止</button>
      <select id="from" title="起始步驟"></select>
      <button id="dl">下載紀錄</button>
      <select id="hist" title="歷史紀錄"></select>
    </div>
  </div>
  <div id="log"></div>
</main>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const PRESET={openai:["https://api.openai.com/v1","gpt-4o"],anthropic:["https://api.anthropic.com","claude-sonnet-4-5"],ollama:["http://localhost:11434/v1","qwen2.5"],puter:["","gpt-4o-mini"]};
const TOOLS=[
 {name:"list_dir",description:"列出資料夾內容，path 為相對路徑，根目錄用空字串。",props:{path:{type:"string"}},req:[]},
 {name:"read_file",description:"讀取文字檔。",props:{path:{type:"string"}},req:["path"]},
 {name:"write_file",description:"建立或覆寫文字檔，自動建立資料夾。",props:{path:{type:"string"},content:{type:"string"}},req:["path","content"]},
 {name:"search",description:"搜尋包含關鍵字的文字行。",props:{query:{type:"string"},path:{type:"string"}},req:["query"]},
 {name:"append_file",description:"在檔案末尾附加內容，檔案不存在則建立。",props:{path:{type:"string"},content:{type:"string"}},req:["path","content"]},
 {name:"replace_in_file",description:"將檔案中第一處 find 文字取代為 replace，適合小幅修改。",props:{path:{type:"string"},find:{type:"string"},replace:{type:"string"}},req:["path","find","replace"]},
 {name:"delete_file",description:"刪除單一檔案（每次都需使用者確認）。",props:{path:{type:"string"}},req:["path"]}
];
const TN={list_dir:"列目錄",read_file:"讀檔",write_file:"寫檔",search:"搜尋",append_file:"附加",replace_in_file:"取代",delete_file:"刪檔"};
const TPL=[
 {name:"研究員",sys:"你負責蒐集並整理資料，條列重點並標示來源檔名，不做無根據的推論。",tools:["list_dir","read_file","search"]},
 {name:"程式碼審查員",sys:"你審查程式碼的正確性、安全性與可讀性，依嚴重程度列出問題與修改建議，並引用檔名與行號。",tools:["list_dir","read_file","search"]},
 {name:"翻譯員",sys:"你負責忠實翻譯，保留格式與專有名詞，並將譯文寫入檔案。",tools:["read_file","write_file"]},
 {name:"摘要員",sys:"你負責把長文濃縮成條理清楚的摘要，附上關鍵結論與待辦事項。",tools:["read_file"]}];

/* ---------- 狀態 ---------- */
let S={llms:[{id:"putter",name:"Putter AI",prov:"puter",base:"",key:"",model:"gpt-4o-mini"}],defLlm:"putter",cl:0,autoWrite:false,roles:[],flows:[],cf:0};
try{const x=JSON.parse(localStorage.getItem("xlx3")||"null");if(x)S=x}catch(e){}
const save=()=>{try{localStorage.setItem("xlx3",JSON.stringify(S))}catch(e){}};
const llmOf=r=>S.llms.find(x=>x.id===r.llm)||S.llms.find(x=>x.id===S.defLlm)||S.llms[0];
const llmName=id=>(S.llms.find(x=>x.id===id)||S.llms[0]).name;
const llmOpts=v=>S.llms.map(l=>`<option value="${l.id}"${l.id==v?" selected":""}>${esc(l.name)}</option>`).join("");
let root=null,rootMsg="尚未選擇資料匣",busy=false,ctl=null,logs=[];
const idb=()=>new Promise((ok,no)=>{const r=indexedDB.open("xlx2",1);r.onupgradeneeded=()=>r.result.createObjectStore("h");r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
async function hPut(v){try{(await idb()).transaction("h","readwrite").objectStore("h").put(v,"root")}catch(e){}}
async function hGet(){try{const d=await idb();return await new Promise(ok=>{const r=d.transaction("h").objectStore("h").get("root");r.onsuccess=()=>ok(r.result);r.onerror=()=>ok(null)})}catch(e){return null}}
const uid=()=>"i"+Math.random().toString(36).slice(2,8);
const setPath=(p,v)=>{const k=p.split(".");let o=S;for(let i=0;i<k.length-1;i++)o=o[k[i]];o[k[k.length-1]]=v;save()};

/* ---------- 範例 ---------- */
function sample(){
  const r=(name,sys,tools,dir)=>({id:uid(),name,sys,tools,dir,llm:"",max:8});
  const a=r("收集員","你負責閱讀資料並條列重點，每點附上來源檔名。只陳述資料中有的內容，不做推測。",["list_dir","read_file","search"],"inbox");
  const b=r("撰稿員","依據提供的重點撰寫結構完整的文件，寫入檔案 draft.md，並在回覆中貼出全文。若收到審核意見，逐點修改。",["read_file","write_file"],"output");
  const c=r("審稿員","你是嚴格的審稿員，檢查每項論述是否有來源、結構是否清楚。第一行只能寫 PASS 或 FAIL，之後說明理由與具體修改建議。",["read_file"],"output");
  const d=r("歸檔員","把最終稿存成 final.md，並回報完成的檔案路徑。",["read_file","write_file"],"output");
  S.roles.push(a,b,c,d);
  S.flows.push({id:uid(),name:"資料整理 → 寫作 → 審稿",maxLoops:2,steps:[
    {role:a.id,type:"work",task:"讀取範圍內所有檔案，整理出重點清單。",gate:false},
    {role:b.id,type:"work",task:"根據重點撰寫完整文件。",gate:false},
    {role:c.id,type:"review",task:"審核上一步的文件是否合格。",gate:false},
    {role:d.id,type:"work",task:"將最終稿歸檔。",gate:true}]});
  S.cf=S.flows.length-1;save();
}

/* ---------- 側欄 ---------- */
const fld=(p,label,val,type="text")=>`<label>${label}<input type="${type}" data-p="${p}" value="${esc(val)}"></label>`;
const area=(p,label,val,rows=3)=>`<label>${label}<textarea rows="${rows}" data-p="${p}">${esc(val)}</textarea></label>`;
const provSel=(p,v)=>`<label>服務類型<select data-p="${p}" data-prov="${p}"><option value="puter"${v=="puter"?" selected":""}>Puter（puter.js，免填 Key）</option><option value="openai"${v=="openai"?" selected":""}>OpenAI 相容</option><option value="anthropic"${v=="anthropic"?" selected":""}>Anthropic</option><option value="ollama"${v=="ollama"?" selected":""}>Ollama（本機）</option></select></label>`;
const llmFields=(p,o)=>provSel(p+".prov",o.prov)+(o.prov==="puter"?"":fld(p+".base","API 網址",o.base)+fld(p+".key","API Key",o.key,"password"))+fld(p+".model","模型名稱",o.model);

function render(){
  const L0=S.llms[S.cl],f=S.flows[S.cf],roleOpts=v=>S.roles.map(r=>`<option value="${r.id}"${r.id==v?" selected":""}>${esc(r.name)}</option>`).join("");
  $("#side").innerHTML=`<h1>小蝦 v4 · 工作流</h1>
  <section><details open><summary>資料匣</summary>
    <button class="pri" data-act="pick" style="width:100%;margin-top:6px">選擇開放的資料匣</button>
    <div class="folder ${root?"":"bad"}">${esc(rootMsg)}</div>
    <label class="chk"><input type="checkbox" data-p="autoWrite" ${S.autoWrite?"checked":""}> 寫檔時不再詢問（刪檔仍會詢問）</label><label class="chk"><input type="checkbox" data-p="saveRuns" ${S.saveRuns?"checked":""}> 將每步輸出存入 _runs/ 資料夾</label></details></section>
  <section><details open><summary>AI 設定（${S.llms.length}）</summary>
    <label>預設使用<select data-p="defLlm" data-re="1">${llmOpts(S.defLlm)}</select></label>
    <div class="row" style="margin-top:8px"><select data-act="pickllm">${S.llms.map((l,i)=>`<option value="${i}"${i==S.cl?" selected":""}>${esc(l.name)}</option>`).join("")}</select><button data-act="addllm">新增</button></div>
    ${L0?`${fld(`llms.${S.cl}.name`,"AI 名稱",L0.name)}${llmFields(`llms.${S.cl}`,L0)}<div class="row" style="margin-top:8px"><button data-act="testllm">測試連線</button><button data-act="delllm">刪除此 AI</button></div>`:""}</details></section>
  <section><details open><summary>角色（${S.roles.length}）</summary>
    ${S.roles.map((r,i)=>`<details class="card"><summary>${esc(r.name)}</summary>
      ${fld(`roles.${i}.name`,"角色名稱",r.name)}
      ${area(`roles.${i}.sys`,"職責提示詞",r.sys,4)}
      ${fld(`roles.${i}.dir`,"工作子目錄（空白＝整個資料匣）",r.dir)}
      <div class="row">${TOOLS.map(t=>`<label class="chk"><input type="checkbox" data-tool="${i}:${t.name}" ${r.tools.includes(t.name)?"checked":""}>${TN[t.name]}</label>`).join("")}</div>
      ${fld(`roles.${i}.max`,"單步最多工具輪數",r.max,"number")}
      <label>使用的 AI<select data-p="roles.${i}.llm" data-re="1"><option value="">跟隨預設（${esc(llmName(S.defLlm))}）</option>${llmOpts(r.llm)}</select></label>
      <button data-act="delrole" data-i="${i}" style="margin-top:8px">刪除角色</button></details>`).join("")}
    <div class="row"><button data-act="addrole">新增空白角色</button><select data-act="tpl"><option value="">從範本新增…</option>${TPL.map((t,i)=>`<option value="${i}">${t.name}</option>`).join("")}</select></div></details></section>
  <section><details open><summary>流程</summary>
    <div class="row" style="margin-top:6px"><select data-act="pickflow">${S.flows.map((x,i)=>`<option value="${i}"${i==S.cf?" selected":""}>${esc(x.name)}</option>`).join("")}</select><button data-act="addflow">新增</button></div>
    ${f?`${fld(`flows.${S.cf}.name`,"流程名稱",f.name)}${fld(`flows.${S.cf}.maxLoops`,"審核不通過時最多退回次數",f.maxLoops,"number")}
    ${f.steps.map((s,j)=>`<div class="card step"><div class="row"><select data-p="flows.${S.cf}.steps.${j}.role">${roleOpts(s.role)}</select>
      <select data-re="1" data-p="flows.${S.cf}.steps.${j}.type"><option value="work"${s.type=="work"?" selected":""}>執行</option><option value="review"${s.type=="review"?" selected":""}>審核</option></select></div>
      ${area(`flows.${S.cf}.steps.${j}.task`,"本步驟任務",s.task,2)}
      <div class="row"><label class="chk"><input type="checkbox" data-p="flows.${S.cf}.steps.${j}.gate" ${s.gate?"checked":""}>執行前需我核准</label>${j>0&&s.type=="work"?`<label class="chk"><input type="checkbox" data-p="flows.${S.cf}.steps.${j}.par" ${s.par?"checked":""}>與上一步並行</label>`:""}
      <button data-act="up" data-j="${j}">上移</button><button data-act="dn" data-j="${j}">下移</button><button data-act="rm" data-j="${j}">刪除</button></div></div>`).join("")}
    <div class="row"><button data-act="addstep">新增步驟</button><button data-act="delflow">刪除流程</button></div>`:"<p>尚無流程。</p>"}
    </details></section>
  <section><details><summary>範例與匯出入</summary><div class="row" style="margin-top:6px">
    <button data-act="sample">載入範例</button><button data-act="export">匯出 JSON</button><button data-act="import">匯入 JSON</button></div>
    <p style="color:var(--mute);font-size:12px">匯出時不含 API Key。</p></details></section>`;
  fillFrom();ready();
}
function ready(){$("#run").disabled=busy||!root||!S.flows[S.cf]||!S.flows[S.cf].steps.length}

/* ---------- 側欄事件 ---------- */
const side=$("#side");
side.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.tool){const [i,n]=t.dataset.tool.split(":");const a=S.roles[i].tools;S.roles[i].tools=t.checked?[...new Set([...a,n])]:a.filter(x=>x!==n);save();return}
  if(!t.dataset.p)return;
  let v=t.type==="checkbox"?t.checked:t.type==="number"?Number(t.value):t.value;
  setPath(t.dataset.p,v);
  if(t.dataset.prov){const base=t.dataset.prov.replace(/\.prov$/,"");const o=base.split(".").reduce((a,k)=>a[k],S);o.base=PRESET[v][0];o.model=PRESET[v][1];save();render()}
  else if(t.dataset.re)render();
});
side.addEventListener("click",async e=>{
  const b=e.target.closest("button");if(!b)return;const a=b.dataset.act,f=S.flows[S.cf];
  if(a==="pick"){
    if(!window.showDirectoryPicker){alert("請使用 Chrome 或 Edge 電腦版，並直接開啟本檔案。");return}
    try{root=await showDirectoryPicker({mode:"readwrite"});await hPut(root);rootMsg="目前開放：/"+root.name}catch(x){}
  }else if(a==="addrole")S.roles.push({id:uid(),name:"新角色",sys:"",tools:["list_dir","read_file"],dir:"",llm:"",max:8});
  else if(a==="addllm"){S.llms.push({id:uid(),name:"新 AI",prov:"openai",base:PRESET.openai[0],key:"",model:PRESET.openai[1]});S.cl=S.llms.length-1}
  else if(a==="delllm"){if(S.llms.length<2){alert("至少保留一個 AI");return}const l=S.llms[S.cl];S.llms.splice(S.cl,1);S.cl=0;S.roles.forEach(r=>{if(r.llm===l.id)r.llm=""});if(S.defLlm===l.id)S.defLlm=S.llms[0].id}
  else if(a==="testllm"){b.disabled=true;b.textContent="測試中…";try{ctl=new AbortController();const r=await llm(S.llms[S.cl],[{r:"u",t:"請只回覆 OK"}],[],"你是測試助理");alert("連線成功，回覆："+String(r.t).slice(0,80))}catch(x){alert("連線失敗："+x.message)}render();return}
  else if(a==="delrole"){const r=S.roles[b.dataset.i];S.roles.splice(b.dataset.i,1);S.flows.forEach(x=>x.steps=x.steps.filter(s=>s.role!==r.id))}
  else if(a==="addflow"){S.flows.push({id:uid(),name:"新流程",maxLoops:2,steps:[]});S.cf=S.flows.length-1}
  else if(a==="delflow"){if(!confirm("刪除此流程？"))return;S.flows.splice(S.cf,1);S.cf=0}
  else if(a==="addstep"){if(!S.roles.length){alert("請先新增角色");return}f.steps.push({role:S.roles[0].id,type:"work",task:"",gate:false})}
  else if(a==="rm")f.steps.splice(b.dataset.j,1);
  else if(a==="up"||a==="dn"){const j=+b.dataset.j,k=a==="up"?j-1:j+1;if(k<0||k>=f.steps.length)return;[f.steps[j],f.steps[k]]=[f.steps[k],f.steps[j]]}
  else if(a==="sample"){if(S.roles.length&&!confirm("範例會新增 4 個角色與 1 條流程，繼續？"))return;sample()}
  else if(a==="export"){
    const c=JSON.parse(JSON.stringify({v:3,llms:S.llms,defLlm:S.defLlm,roles:S.roles,flows:S.flows,autoWrite:S.autoWrite}));c.llms.forEach(l=>l.key="");
    dl(JSON.stringify(c,null,2),"workstream.json","application/json");return
  }else if(a==="import"){
    const i=document.createElement("input");i.type="file";i.accept=".json";
    i.onchange=async()=>{try{const x=JSON.parse(await i.files[0].text());if(!x.roles||!x.flows)throw 0;const old=S.llms;S={...S,...x,cf:0,cl:0};if(!S.llms||!S.llms.length)S.llms=old;S.llms.forEach(l=>{const o=old.find(y=>y.id===l.id);if(o&&!l.key)l.key=o.key});if(!S.llms.find(l=>l.id===S.defLlm))S.defLlm=S.llms[0].id;save();render()}catch(err){alert("檔案格式不正確")}};
    i.click();return
  }
  save();render();
});
side.addEventListener("change",e=>{const a=e.target.dataset.act;if(a==="pickflow"){S.cf=+e.target.value;save();render()}else if(a==="pickllm"){S.cl=+e.target.value;save();render()}else if(a==="tpl"){const t=TPL[e.target.value];if(t){S.roles.push({id:uid(),name:t.name,sys:t.sys,tools:t.tools,dir:"",llm:"",max:8});save();render()}}});

/* ---------- 紀錄 ---------- */
const log=$("#log");
function md(t){const bl=[];t=esc(t).replace(/```[^\n]*\n([\s\S]*?)```/g,(_,c)=>{bl.push(c);return "\u0000"+(bl.length-1)+"\u0000"});
  t=t.split("\n").map(l=>{let m;if(m=l.match(/^(#{1,4})\s+(.*)/))return "<h"+(m[1].length+2)+">"+m[2]+"</h"+(m[1].length+2)+">";if(m=l.match(/^\s*[-*]\s+(.*)/))return '<div class="li">• '+m[1]+"</div>";return l+"<br>"}).join("");
  t=t.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`([^`]+)`/g,"<code>$1</code>");
  return t.replace(/\u0000(\d+)\u0000/g,(_,i)=>"<pre>"+bl[i]+"</pre>")}
function L(cls,txt,who){const d=document.createElement("div");d.className="m "+cls+(cls==="a"?" md":"");if(who){const b=document.createElement("span");b.className="who";b.textContent=who;d.append(b)}
  if(cls==="a"){const c=document.createElement("div");c.innerHTML=md(txt);d.append(c);const cp=document.createElement("button");cp.className="cp";cp.textContent="複製";cp.onclick=()=>navigator.clipboard.writeText(txt).then(()=>{cp.textContent="已複製";setTimeout(()=>cp.textContent="複製",1200)});d.append(cp)}else d.append(document.createTextNode(txt));log.append(d);log.scrollTop=1e9;logs.push((who?"### "+who+"\n":"")+txt);return d}
function T(name,args,out){const d=document.createElement("details");d.className="t";const s=document.createElement("summary");s.textContent="工具："+name+" "+(args.path||args.query||"");const p=document.createElement("pre");p.textContent=out;d.append(s,p);log.append(d);log.scrollTop=1e9;logs.push("- 工具 "+name+" "+(args.path||args.query||""))}
function dl(txt,name,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:type||"text/markdown"}));a.download=name;a.click()}
$("#dl").onclick=()=>dl(logs.join("\n\n"),"run-log.md");
const HK="xlx3h",getH=()=>{try{return JSON.parse(localStorage.getItem(HK)||"[]")}catch(e){return[]}};
function fillHist(){$("#hist").innerHTML='<option value="">歷史紀錄（選擇即下載）</option>'+getH().map((x,i)=>`<option value="${i}">${esc(x.t)} · ${esc(x.flow)}</option>`).join("")}
function pushHist(flow,goal){try{const h=getH();h.unshift({t:new Date().toLocaleString(),flow,goal:goal.slice(0,30),md:logs.join("\n\n").slice(0,100000)});localStorage.setItem(HK,JSON.stringify(h.slice(0,12)))}catch(e){}fillHist()}
$("#hist").onchange=e=>{const x=getH()[e.target.value];if(x)dl(x.md,"run-"+x.t.replace(/[^\d]/g,"")+".md");e.target.value=""};
function fillFrom(){const f=S.flows[S.cf];$("#from").innerHTML=f?f.steps.map((st,j)=>{const r=S.roles.find(x=>x.id===st.role);return `<option value="${j}">從第 ${j+1} 步開始（${esc(r?r.name:"?")}）</option>`}).join(""):""}
fillHist();

/* ---------- 檔案工具（以角色子目錄為範圍） ---------- */
const parts=p=>{const a=String(p||"").split("/").filter(x=>x&&x!==".");if(a.includes(".."))throw new Error("路徑不可包含 ..");return a};
async function dirAt(base,a,create){let d=base;for(const n of a)d=await d.getDirectoryHandle(n,{create});return d}
async function walk(d,pre,fn,c){for await(const [n,h] of d.entries()){if(c.n>400)return;if(h.kind==="directory"){if(n.startsWith(".")||n==="node_modules")continue;await walk(h,pre+n+"/",fn,c)}else{c.n++;await fn(h,pre+n)}}}
const impl={
  async list_dir(b,{path}){const d=await dirAt(b,parts(path));const o=[];for await(const [n,h] of d.entries())o.push((h.kind==="directory"?"[資料夾] ":"[檔案] ")+n);return o.sort().join("\n")||"（空資料夾）"},
  async read_file(b,{path}){const a=parts(path),n=a.pop();const t=await(await(await(await dirAt(b,a)).getFileHandle(n)).getFile()).text();return t.length>60000?t.slice(0,60000)+"\n…（已截斷）":t},
  async write_file(b,{path,content}){
    const a=parts(path),n=a.pop();if(!n)throw new Error("缺少檔名");
    if(!S.autoWrite&&!confirm("寫入檔案：/"+[...a,n].join("/")+"（"+content.length+" 字）\n允許嗎？"))return "使用者拒絕寫入。";
    const w=await(await(await dirAt(b,a,true)).getFileHandle(n,{create:true})).createWritable();await w.write(content);await w.close();return "已寫入 /"+[...a,n].join("/")},
  async search(b,{query,path}){const q=query.toLowerCase(),out=[],pa=parts(path);
    await walk(await dirAt(b,pa),pa.join("/")+(pa.length?"/":""),async(h,p)=>{if(out.length>=50)return;const f=await h.getFile();if(f.size>200000)return;let t;try{t=await f.text()}catch(e){return}if(t.includes("\0"))return;t.split("\n").forEach((l,i)=>{if(out.length<50&&l.toLowerCase().includes(q))out.push(p+":"+(i+1)+": "+l.trim().slice(0,160))})},{n:0});
    return out.join("\n")||"沒有找到符合的內容。"},
  async append_file(b,{path,content}){const a=parts(path),n=a.pop();if(!n)throw new Error("缺少檔名");
    if(!S.autoWrite&&!confirm("附加內容到 /"+[...a,n].join("/")+"\n允許嗎？"))return "使用者拒絕寫入。";
    const d=await dirAt(b,a,true);let old="";try{old=await(await(await d.getFileHandle(n)).getFile()).text()}catch(e){}
    const w=await(await d.getFileHandle(n,{create:true})).createWritable();await w.write(old+content);await w.close();return "已附加到 /"+[...a,n].join("/")},
  async replace_in_file(b,{path,find,replace}){const a=parts(path),n=a.pop();const d=await dirAt(b,a);const fh=await d.getFileHandle(n);const old=await(await fh.getFile()).text();
    if(!old.includes(find))throw new Error("找不到要取代的文字");
    if(!S.autoWrite&&!confirm("修改檔案 /"+[...a,n].join("/")+"\n允許嗎？"))return "使用者拒絕寫入。";
    const w=await fh.createWritable();await w.write(old.replace(find,()=>replace));await w.close();return "已修改 /"+[...a,n].join("/")},
  async delete_file(b,{path}){const a=parts(path),n=a.pop();if(!n)throw new Error("缺少檔名");
    if(!confirm("刪除檔案 /"+[...a,n].join("/")+"？此操作無法復原。"))return "使用者拒絕刪除。";
    await(await dirAt(b,a)).removeEntry(n);return "已刪除 /"+[...a,n].join("/")}
};

/* ---------- LLM 轉接 ---------- */
async function post(url,headers,body){
  for(let k=0;;k++){
    const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json",...headers},body:JSON.stringify(body),signal:ctl.signal});
    const t=await r.text();if(r.ok)return JSON.parse(t);
    if((r.status===429||r.status>=500)&&k<2){await new Promise(ok=>setTimeout(ok,1500*(k+1)));continue}
    throw new Error("HTTP "+r.status+"："+t.slice(0,300));
  }}
function loadPuter(){return window.puter?Promise.resolve():new Promise((ok,no)=>{const s=document.createElement("script");s.src="https://js.puter.com/v2/";s.onload=ok;s.onerror=()=>no(new Error("無法載入 puter.js，請確認網路連線"));document.head.append(s)})}
async function puterChat(c,h,tools,sys){
  await loadPuter();
  let s=sys;
  if(tools.length)s+="\n\n你可以呼叫工具。需要時只輸出下列格式的區塊（可多個），輸出後立刻停止，等待結果：\n```tool\n{\"name\":\"工具名\",\"args\":{\"參數\":\"值\"}}\n```\n可用工具：\n"+tools.map(t=>"- "+t.name+"（"+t.description+"）參數："+Object.keys(t.props).join("、")).join("\n");
  const msgs=[{role:"system",content:s}];
  for(const m of h){
    if(m.r==="u")msgs.push({role:"user",content:m.t});
    else if(m.r==="a")msgs.push({role:"assistant",content:(m.t||"")+(m.calls||[]).map(x=>"\n```tool\n"+JSON.stringify({name:x.name,args:x.args})+"\n```").join("")});
    else msgs.push({role:"user",content:"【工具結果】\n"+m.results.map(r=>r.name+"：\n"+r.out).join("\n---\n")});
  }
  const r=await puter.ai.chat(msgs,{model:c.model});
  if(ctl&&ctl.signal.aborted){const e=new Error("abort");e.name="AbortError";throw e}
  const c0=r&&r.message?r.message.content:r;
  let t=typeof c0==="string"?c0:Array.isArray(c0)?c0.map(x=>x.text||"").join(""):String(r);
  const calls=[];
  t=t.replace(/```tool\s*([\s\S]*?)```/g,(_,j)=>{try{const o=JSON.parse(j);if(o.name)calls.push({id:uid(),name:o.name,args:o.args||{}})}catch(e){}return""}).trim();
  return{t,calls};
}
async function llm(c,h,tools,sys){
  if(c.prov==="puter")return puterChat(c,h,tools,sys);
  const base=c.base.replace(/\/+$/,"");
  if(c.prov==="anthropic"){
    const msgs=h.map(m=>m.r==="u"?{role:"user",content:m.t}:m.r==="a"?{role:"assistant",content:[...(m.t?[{type:"text",text:m.t}]:[]),...(m.calls||[]).map(x=>({type:"tool_use",id:x.id,name:x.name,input:x.args}))]}:{role:"user",content:m.results.map(r=>({type:"tool_result",tool_use_id:r.id,content:r.out}))});
    const body={model:c.model,max_tokens:4096,system:sys,messages:msgs};
    if(tools.length)body.tools=tools.map(t=>({name:t.name,description:t.description,input_schema:{type:"object",properties:t.props,required:t.req}}));
    const j=await post(base+"/v1/messages",{"x-api-key":c.key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body);
    return{t:j.content.filter(x=>x.type==="text").map(x=>x.text).join("\n"),calls:j.content.filter(x=>x.type==="tool_use").map(x=>({id:x.id,name:x.name,args:x.input||{}}))};
  }
  const msgs=[{role:"system",content:sys}];
  for(const m of h){if(m.r==="u")msgs.push({role:"user",content:m.t});else if(m.r==="a"){const o={role:"assistant",content:m.t||null};if(m.calls&&m.calls.length)o.tool_calls=m.calls.map(x=>({id:x.id,type:"function",function:{name:x.name,arguments:JSON.stringify(x.args)}}));msgs.push(o)}else m.results.forEach(r=>msgs.push({role:"tool",tool_call_id:r.id,content:r.out}))}
  
  const body={model:c.model,messages:msgs};
  if(tools.length && c.prov !== "ollama" && !c.base.includes("localhost:8080")){
    body.tools=tools.map(t=>({type:"function",function:{name:t.name,description:t.description,parameters:{type:"object",properties:t.props,required:t.req}}}));
  }

  try {
    const j=await post(base+"/chat/completions",c.key?{Authorization:"Bearer "+c.key}:{},body);
    const m=j.choices[0].message;
    return{t:m.content||"",calls:(m.tool_calls||[]).map(x=>{let g={};try{g=JSON.parse(x.function.arguments||"{}")}catch(e){}return{id:x.id,name:x.function.name,args:g}})};
  } catch(err) {
    if(err.message.includes("500") && tools.length > 0) {
      delete body.tools;
      const j=await post(base+"/chat/completions",c.key?{Authorization:"Bearer "+c.key}:{},body);
      const m=j.choices[0].message;
      return{t:m.content||"",calls:[]};
    }
    throw err;
  }
}

/* ---------- 單一角色執行 ---------- */
async function agent(role,msg,extraSys){
  const cfg=llmOf(role),tools=TOOLS.filter(t=>role.tools.includes(t.name));
  let base=root;for(const n of parts(role.dir))base=await base.getDirectoryHandle(n,{create:true});
  const sys=role.sys+(extraSys||"")+"\n你的工作範圍是資料匣中的「"+(role.dir||"根目錄")+"」，路徑一律使用相對於此範圍的路徑。使用繁體中文。";
  const h=[{r:"u",t:msg}];let last="";
  for(let i=0;i<(role.max||8);i++){
    const r=await llm(cfg,h,tools,sys);h.push({r:"a",t:r.t,calls:r.calls});if(r.t)last=r.t;
    if(!r.calls.length)return last;
    const results=[];
    for(const c of r.calls){let out;try{if(!role.tools.includes(c.name))throw new Error("此角色未被授權使用 "+c.name);out=String(await impl[c.name](base,c.args))}catch(e){out="錯誤："+(e.message||e)}
      results.push({id:c.id,name:c.name,args:c.args,out});T(c.name,c.args,out)}
    h.push({r:"t",results});
  }
  return last+"\n（已達此角色的工具輪數上限）";
}

/* ---------- 人工關卡 ---------- */
function gate(title,text){
  return new Promise(ok=>{
    const d=L("h gate","",title),ta=document.createElement("textarea");ta.value=text;ta.style.width="100%";
    const r=document.createElement("div");r.className="row";
    const y=document.createElement("button");y.className="pri";y.textContent="核准並繼續（可先修改上方內容）";
    const n=document.createElement("button");n.textContent="終止流程";
    y.onclick=()=>{d.querySelectorAll("button").forEach(b=>b.disabled=true);ta.disabled=true;logs.push("（已核准）");ok(ta.value)};
    n.onclick=()=>{d.querySelectorAll("button").forEach(b=>b.disabled=true);ta.disabled=true;logs.push("（已終止）");ok(null)};
    r.append(y,n);d.append(ta,r);log.scrollTop=1e9;
  });
}

/* ---------- 流程執行 ---------- */
async function runFlow(){
  const f=S.flows[S.cf],goal=$("#goal").value.trim();
  if(!goal){alert("請先輸入總目標");return}
  busy=true;ctl=new AbortController();$("#run").hidden=true;$("#stop").hidden=false;log.innerHTML="";document.body.dataset.v="run";
  const t0=Date.now(),stamp=new Date().toISOString().slice(0,16).replace(/[:T]/g,"-");
  logs=["# 執行紀錄：「"+f.name+"」\n總目標："+goal];
  let i=+$("#from").value||0,prev=i?"（從第 "+(i+1)+" 步開始，無前一步輸出）":"",work="",fb="",loops=0,lastWork=-1;
  L("s","流程開始：「"+f.name+"」"+(i?"，從第 "+(i+1)+" 步起":""));
  const saveOut=async(n,role,out)=>{if(!S.saveRuns)return;try{const d=await(await root.getDirectoryHandle("_runs",{create:true})).getDirectoryHandle(stamp,{create:true});const w=await(await d.getFileHandle("step"+n+"-"+role.name.replace(/[\\\/:*?"<>|\s]/g,"_")+".md",{create:true})).createWritable();await w.write(out);await w.close()}catch(e){}};
  try{
    while(i<f.steps.length){
      const s0=f.steps[i],role0=S.roles.find(r=>r.id===s0.role);
      if(!role0){L("e","第 "+(i+1)+" 步的角色已被刪除");break}
      const grp=[i];
      if(s0.type==="work")while(f.steps[grp[grp.length-1]+1]&&f.steps[grp[grp.length-1]+1].par&&f.steps[grp[grp.length-1]+1].type==="work")grp.push(grp[grp.length-1]+1);
      if(s0.gate){const g=await gate("第 "+(i+1)+" 步前的人工核准（"+role0.name+"）",prev||"（尚無前一步輸出）");if(g===null){L("s","已由使用者終止。");break}prev=g}
      const one=async idx=>{
        const st=f.steps[idx],role=S.roles.find(r=>r.id===st.role);
        if(!role)throw new Error("第 "+(idx+1)+" 步的角色已被刪除");
        let msg="【總目標】\n"+goal+"\n\n【本步驟任務】\n"+(st.task||"依職責處理")+"\n\n【上一步輸出】\n"+(prev||"（無）"),extra="";
        if(st.type==="review"){extra="\n第一行只能寫 PASS 或 FAIL，之後才說明理由。";msg+="\n\n請審核「上一步輸出」。"}
        else if(fb)msg+="\n\n【審核意見，請逐點修改】\n"+fb+"\n\n【你上一版的輸出】\n"+work;
        L("s","第 "+(idx+1)+" 步 · "+role.name+(st.type==="review"?"（審核）":"")+" ｜AI："+llmOf(role).name+(grp.length>1?" ｜並行":""));
        const t=Date.now(),out=await agent(role,msg,extra);
        L("a",out,role.name+" · "+((Date.now()-t)/1000).toFixed(1)+" 秒");
        await saveOut(idx+1,role,out);
        return out;
      };
      const outs=await Promise.all(grp.map(one));
      if(s0.type==="review"){
        const out=outs[0];
        if(/^\s*PASS/i.test(out)){prev=work||prev;i++}
        else if(loops<(f.maxLoops||0)&&lastWork>=0){loops++;fb=out;L("s","審核未通過，退回第 "+(lastWork+1)+" 步（第 "+loops+"/"+f.maxLoops+" 次）");prev=work;i=lastWork}
        else{L("e","審核未通過且已達退回上限，流程繼續往下。");prev=work||prev;i++}
      }else{
        work=outs.length>1?outs.map((o,k)=>"## "+S.roles.find(r=>r.id===f.steps[grp[k]].role).name+"\n"+o).join("\n\n"):outs[0];
        prev=work;lastWork=i;fb="";i=grp[grp.length-1]+1;
      }
    }
    L("s","流程結束，共 "+((Date.now()-t0)/1000).toFixed(1)+" 秒。");
  }catch(e){L("e",e.name==="AbortError"?"已停止。":"執行失敗："+e.message+"\n請檢查 API 網址、Key、模型，以及該服務是否允許瀏覽器直接連線。")}
  pushHist(f.name,goal);
  busy=false;$("#run").hidden=false;$("#stop").hidden=true;ready();
}
$("#run").onclick=runFlow;
$("#stop").onclick=()=>ctl&&ctl.abort();

/* ---------- 啟動 ---------- */
$("#tabs").onclick=e=>{const b=e.target.closest("button");if(!b)return;document.body.dataset.v=b.dataset.v;document.querySelectorAll("#tabs button").forEach(x=>x.classList.toggle("on",x===b))};
new MutationObserver(()=>document.querySelectorAll("#tabs button").forEach(x=>x.classList.toggle("on",x.dataset.v===document.body.dataset.v))).observe(document.body,{attributes:true,attributeFilter:["data-v"]});
$("#goal").addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)&&!$("#run").disabled&&!$("#run").hidden)runFlow()});
(async()=>{
  const h=await hGet();
  if(h){try{if(await h.queryPermission({mode:"readwrite"})==="granted"){root=h;rootMsg="目前開放：/"+h.name}else rootMsg="「"+h.name+"」需重新授權，請再按一次選擇資料匣。"}catch(e){}}
  render();
})();
